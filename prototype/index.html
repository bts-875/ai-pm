<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业大模型训练验证平台 · ModelForge</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#2f6fed',
        canvas: '#f5f7fb',
      },
      fontFamily: {
        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
        mono: ['SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
      },
      animation: {
        'fade-up': 'fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
        'fade-in': 'fadeIn 1s ease-out forwards',
        'float': 'float 6s ease-in-out infinite',
        'float-delayed': 'float 6s ease-in-out 3s infinite',
      },
      keyframes: {
        fadeUp: {
          '0%': { opacity: '0', transform: 'translateY(30px)' },
          '100%': { opacity: '1', transform: 'translateY(0)' },
        },
        fadeIn: {
          '0%': { opacity: '0' },
          '100%': { opacity: '1' },
        },
        float: {
          '0%, 100%': { transform: 'translateY(0) scale(1)' },
          '50%': { transform: 'translateY(-20px) scale(1.05)' },
        }
      }
    }
  }
}
</script>
<style>
  body {
    background-color: #f5f7fb;
    color: #1f2733;
    /* 浅色网格背景 */
    background-image: 
      linear-gradient(rgba(47, 111, 237, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47, 111, 237, 0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: center center;
    overflow: hidden;
  }
  
  /* 科技感光晕 */
  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.6;
  }

  /* 按钮悬停呼吸效果 */
  .btn-primary {
    background: linear-gradient(135deg, #2f6fed 0%, #1f56c9 100%);
    position: relative;
    transition: all 0.3s ease;
    box-shadow: 0 4px 14px 0 rgba(47, 111, 237, 0.39);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(47, 111, 237, 0.5);
  }
</style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

  <!-- 背景环境光 (柔和的蓝/紫渐变光晕) -->
  <div class="glow-orb bg-blue-400 w-[500px] h-[500px] top-[10%] left-[10%] animate-float"></div>
  <div class="glow-orb bg-purple-300 w-[600px] h-[600px] bottom-[10%] right-[10%] animate-float-delayed"></div>
  <div class="glow-orb bg-cyan-200 w-[400px] h-[400px] top-[40%] left-[40%] animate-pulse"></div>

  <!-- 中心内容区 -->
  <main class="relative z-10 flex flex-col items-center text-center px-6 max-w-4xl mx-auto mt-[-40px]">
    
    <!-- 顶部小标识 -->
    <div class="animate-fade-up opacity-0 flex items-center gap-2 mb-8 bg-white/60 backdrop-blur-md px-4 py-1.5 rounded-full border border-blue-100 shadow-sm" style="animation-delay: 0.1s;">
      <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
      <span class="text-[11px] font-mono tracking-widest text-primary font-semibold uppercase">ModelForge Enterprise Edition</span>
    </div>

    <!-- 主标题 -->
    <h1 class="animate-fade-up opacity-0 text-5xl md:text-7xl font-extrabold tracking-tight text-gray-900 mb-6 leading-tight" style="animation-delay: 0.2s;">
      行业大模型<br class="hidden md:block" />
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-blue-400">训练验证平台</span>
    </h1>

    <!-- 欢迎语 / 副标题 -->
    <p class="animate-fade-up opacity-0 text-lg md:text-xl text-gray-500 font-normal max-w-2xl mb-12 leading-relaxed" style="animation-delay: 0.3s;">
      从数据清洗、模型微调到评测反哺，一站式构建您的私有化领域大模型。<br>
      确保数据不出域，让大模型真正懂您的业务。
    </p>

    <!-- 主按钮 -->
    <div class="animate-fade-up opacity-0" style="animation-delay: 0.4s;">
      <a href="项目概览.html" class="btn-primary inline-flex items-center justify-center gap-2 px-12 py-4 rounded-full text-base font-semibold text-white">
        进入系统
        <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
      </a>
    </div>

    <!-- 底部特性标签 -->
    <div class="animate-fade-in opacity-0 flex flex-wrap justify-center gap-8 mt-24 text-sm text-gray-600 font-medium" style="animation-delay: 0.8s;">
      <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-lg shadow-sm border border-gray-100">
        <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        私有化部署
      </div>
      <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-lg shadow-sm border border-gray-100">
        <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        多租户隔离
      </div>
      <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-lg shadow-sm border border-gray-100">
        <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        评测反哺闭环
      </div>
    </div>

  </main>

</body>
</html>
